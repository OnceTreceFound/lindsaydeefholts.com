# Diagnóstico: prueba la conexión SSH a SiteGround y muestra el motivo si falla.
name: Probar conexión SSH
on: { workflow_dispatch: }
env:
  SG_HOST: ssh.lindsaydeefholts.com
  SG_PORT: "18765"
  SG_USER: u235-bz5tvygj6lhb
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        env:
          SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SSH_PASS: ${{ secrets.SG_SSH_PASS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_sg; chmod 600 ~/.ssh/id_sg
          echo "::notice::llave: $(wc -l < ~/.ssh/id_sg) lineas; primera: $(head -1 ~/.ssh/id_sg | cut -c1-40); contraseña definida: $([ -n "$SSH_PASS" ] && echo si || echo no)"
          if [ -n "$SSH_PASS" ]; then ssh-keygen -p -P "$SSH_PASS" -N "" -f ~/.ssh/id_sg >/dev/null 2>&1 && echo "::notice::contraseña de la llave: correcta" || echo "::warning::contraseña de la llave: INCORRECTA o llave mal pegada"; fi
          ssh-keygen -y -f ~/.ssh/id_sg >/dev/null 2>&1 && echo "::notice::formato de la llave: valido" || echo "::warning::formato de la llave: NO valido (quedó cifrada o mal pegada)"
          ssh-keyscan -p "$SG_PORT" "$SG_HOST" > ~/.ssh/known_hosts 2>/dev/null; echo "::notice::host responde: $([ -s ~/.ssh/known_hosts ] && echo si || echo NO)"
          out=$(ssh -v -i ~/.ssh/id_sg -p "$SG_PORT" -o BatchMode=yes -o StrictHostKeyChecking=no "$SG_USER@$SG_HOST" "echo CONECTADO && pwd" 2>&1 | grep -iE "CONECTADO|Permission denied|Authentications that can|Offering|Server accepts|refused|timed out|Could not resolve|incorrect|^/" | head -8 | tr '\n' ' | ')
          echo "::notice::ssh: $out"
